<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ζ-Field Poker</title>
  <meta name="description"
    content="Play heads-up Texas Hold'em against an AI while a Monte Carlo model reads every decision and suggests your move.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=8">
</head>

<body class="page-play">
  <header class="topbar">
    <a class="brand" href="index.html"><img src="logo.svg" alt="" width="28" height="28">ζ-Field <span>Poker</span></a>
    <nav>
      <a href="index.html" aria-current="page">Play</a>
      <a href="how-it-works.html">How it works</a>
    </nav>
  </header>

  <main class="play">
    <!-- Table + controls -->
    <section class="table-col" aria-label="Poker table">
      <div class="felt">
        <div class="seat villain">
          <div class="seat-head">
            <span class="seat-name">Villain</span>
            <span class="stack" id="opp-stack">$500</span>
          </div>
          <div class="cards" id="opp-cards"></div>
        </div>

        <div class="board">
          <div class="street" id="street-label">&nbsp;</div>
          <div class="cards" id="community-cards"></div>
          <div class="pot" id="pot-display">Pot $0</div>
          <ol class="log" id="action-log" aria-live="polite"></ol>
        </div>

        <div class="seat hero">
          <div class="cards" id="hero-cards"></div>
          <div class="seat-head">
            <span class="seat-name">You</span>
            <span class="hand-name" id="hand-name"></span>
            <span class="stack" id="hero-stack">$500</span>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn fold" id="btn-fold">Fold</button>
        <button class="btn call" id="btn-call">Check</button>
        <div class="raise">
          <input type="range" id="raise-slider" min="10" max="490" value="30" aria-label="Bet or raise amount">
          <button class="btn raise" id="btn-raise"><span id="raise-label">Bet $</span><span id="raise-val">30</span></button>
        </div>
        <button class="btn deal" id="btn-deal">Deal</button>
      </div>
    </section>

    <!-- Model read-out -->
    <aside class="advisor" aria-label="Model analysis">
      <div class="advice" id="advice">
        <div class="eyebrow">Model suggests</div>
        <div class="action" id="rec-action">—</div>
        <p class="reason" id="rec-reason">Deal a hand to get the model's read.</p>
      </div>

      <dl class="numbers">
        <div>
          <dt>Your equity</dt>
          <dd id="stat-equity">—</dd>
        </div>
        <div>
          <dt>Needed to call</dt>
          <dd id="stat-potodds">—</dd>
        </div>
        <div>
          <dt>EV of calling</dt>
          <dd id="stat-ev">—</dd>
        </div>
      </dl>

      <figure class="field">
        <figcaption>
          <span>Action field Ψ(equity, pot odds)</span>
          <a href="how-it-works.html#field">What is this?</a>
        </figcaption>
        <canvas id="field-canvas" width="400" height="400"></canvas>
        <div class="field-legend">
          <div class="ramp" aria-hidden="true"></div>
          <div class="ramp-labels"><span>Fold</span><span>Call</span><span>Raise</span></div>
          <div class="keys">
            <span><i class="key-dot"></i>your spot</span>
            <span><i class="key-dash"></i>break-even (equity = pot odds)</span>
          </div>
        </div>
      </figure>

      <dl class="session">
        <div>
          <dt>Hands</dt>
          <dd id="stat-hands">0</dd>
        </div>
        <div>
          <dt>Won</dt>
          <dd id="stat-won">—</dd>
        </div>
        <div>
          <dt>Profit</dt>
          <dd id="stat-profit">$0</dd>
        </div>
      </dl>
    </aside>
  </main>

  <script type="module" src="poker/ui.js?v=7"></script>
</body>

</html>
